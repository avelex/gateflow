[package]
name = "gateflow-enclave"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
resolver = "3"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "wasi")'.dependencies]
wasi-http-client = "0.2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
