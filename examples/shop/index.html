<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Example shop</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; max-width: 480px; margin: 48px auto; padding: 0 16px; }
      button { font: inherit; padding: 10px 18px; border-radius: 8px; border: 0; background: #111; color: #fff; cursor: pointer; }
      #status { color: #555; }
    </style>
  </head>
  <body>
    <h1>Coffee beans, 250 g</h1>
    <p>PRICE</p>
    <button id="buy">Buy</button>
    <p id="status"></p>
    <script src="GATEFLOW_URL/js/v1/gateflow.js"></script>
    <script>
      const status = document.getElementById("status");
      document.getElementById("buy").onclick = async () => {
        const invoice = await (await fetch("/checkout", { method: "POST" })).json();
        if (!invoice.id && invoice.id !== 0) return (status.textContent = invoice.error ?? "Could not start checkout");
        // UI only: the order is fulfilled by the webhook on the server.
        Gateflow.open(invoice.id, { onStatus: (e) => (status.textContent = `Invoice ${e.invoice}: ${e.status}`) });
      };
    </script>
  </body>
</html>
